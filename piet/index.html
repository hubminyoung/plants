<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piet Oudolf 수종리스트</title></head><body>
<title>Piet Oudolf 수종리스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 책 도감 페이지처럼: 종이색 바탕, 얇은 괘선, 기호는 모두 같은 크기의 선 그림 */
:root{
  --bg:#f7f6f1; --surface:#ffffff; --fg:#000000; --muted:#000000; --rule:#d9dad0; --accent:#4f6b3a; --band:#eef0e7; --warn:#000000; --warn-bg:#f8e3dc; --good:#000000; --good-bg:#e0eef5; --work:#eef4e4; --famb:#46513f; --famfg:#ffffff; --genb:#efefeb;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1c18; --surface:#22251f; --fg:#e7e9e0; --muted:#e7e9e0; --rule:#3a3e34; --accent:#a3c086; --band:#272a23; --warn:#e7e9e0; --warn-bg:#47261e; --good:#e7e9e0; --good-bg:#1f3442; --work:#26301f; --famb:#5b6a51; --famfg:#ffffff; --genb:#2a2c28; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1c18; --surface:#22251f; --fg:#e7e9e0; --muted:#e7e9e0; --rule:#3a3e34; --accent:#a3c086; --band:#272a23; --warn:#e7e9e0; --warn-bg:#47261e; --good:#e7e9e0; --good-bg:#1f3442; --work:#26301f; --famb:#5b6a51; --famfg:#ffffff; --genb:#2a2c28; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:none;margin:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font-family:var(--serif);font-weight:500;font-size:1.9rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 16px;border:1px solid var(--rule);background:var(--surface);border-radius:6px}
.legend .grp{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legend .lab{font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-right:2px}
.legend span.it{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ic{width:14px;height:14px;display:inline-block;vertical-align:-2px;color:var(--fg);flex:none}
.leaf{color:var(--accent)}
.scroll{overflow:visible;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:5px 3px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
thead th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;box-shadow:0 1px 0 var(--rule);background:var(--band);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}
td.c .ic+.ic{margin-left:3px}
.sci{font-family:var(--serif);font-size:1.02rem;line-height:1.3}
.sci i{font-style:italic}
.com{display:block;font-family:var(--sans);font-size:.76rem;color:var(--muted);margin-top:1px}
td.sci{min-width:200px}
tr.fam th{background:var(--band);padding:12px 10px 8px;border-top:2px solid var(--rule);text-align:left;font-weight:500}
tr.fam .fl{font-family:var(--serif);font-size:1.1rem;color:var(--accent)}
tr.fam .fk{font-weight:700;margin-left:4px}
tr.gen td{border-top:1px solid var(--rule);padding-top:10px}
tr.gen .sci{font-weight:500;font-size:1.08rem}
tr.sp td.sci{padding-left:14px}
tr.gen .gk{font-family:var(--sans);font-size:.85rem;font-weight:500;margin-left:4px}
tr.fam .fn{color:var(--muted);font-size:.8rem;margin-left:6px;font-weight:400}
td.page{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td.note{min-width:150px}
td.tags{min-width:130px}
.tag{display:inline-block;font-size:.74rem;line-height:1.35;padding:1px 6px;margin:1px 3px 1px 0;border-radius:4px;background:var(--band);color:var(--fg);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--good)}
td.role{min-width:100px;color:var(--accent)}
.kv{color:var(--muted)}
.kv .ic{opacity:.5}
.dv{color:var(--muted);font-style:italic}
.dv .ic{opacity:.45}
.tag.k{opacity:.6}
.tag.d{opacity:.6;font-style:italic;background:transparent;border:1px dashed var(--rule)}
.soil{display:block;font-size:.72rem;color:var(--muted);white-space:normal;text-align:center}
.kn{display:block;color:var(--muted);font-size:.8rem}
.dn{display:block;color:var(--muted);font-size:.8rem;font-style:italic}
td.pm{font-weight:700}
tbody tr:hover td{background:var(--band)}
.search{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.search input{flex:1 1 320px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
td.empty{padding:24px 12px;color:var(--muted)}
@media (max-width:1000px){.scroll{overflow-x:auto}}
.foot{color:var(--muted);font-size:.8rem}

/* 글자 통일: 고딕, 진한 검정, 기울임·옅은 글씨 없음 */
body,h1,.sci,.sci i,tr.fam .fl,tr.gen .sci,.com,.soil,.kn,.dn,td.page,thead th,.sub,.foot,.legend .lab,.count,td.role,td.note{font-family:var(--sans)!important;font-style:normal!important;color:var(--fg)!important}
.kv,.dv{color:var(--fg)!important;font-style:normal!important}
.kv .ic,.dv .ic{opacity:1!important}
.tag,.tag.k,.tag.d{opacity:1!important;font-style:normal!important;color:var(--fg)!important}
.tag.d{border:0!important;background:var(--band)!important}
.tag.warn{background:var(--warn-bg)!important}
.tag.good{background:var(--good-bg)!important}
.sci{font-size:.95rem}
.com{font-size:.78rem}
tr.sp.w td{background:var(--work)}
tr.fam th{background:var(--famb)!important;border-top:0!important}
tr.fam th,tr.fam th *{color:var(--famfg)!important}
tr.gen td{border-top:1px solid var(--rule)}
tr.gen td,tr.gen td *{font-weight:700!important}
tr.gen td{border-top:2px solid var(--famb)!important;padding-top:10px!important}
tr.gen td.sci{font-size:1.08rem!important}
tr.gen + tr.sp td{border-top:0}
tbody tr.sp.w:hover td{background:var(--work)}
*{font-style:normal!important}

.ths{float:left;display:flex;gap:3px;margin:0 7px 2px 0}
.th{width:40px;height:40px;border-radius:4px;object-fit:cover;cursor:pointer;background:var(--band)}
.th.add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--rule);color:var(--fg);font-size:18px;box-sizing:border-box}
.imgtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imgtools button,.imgtools .btn,.pk button,.pk .btn{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer}
#pick{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#pick[hidden],#view[hidden]{display:none!important}
#view{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.vw{display:grid;gap:8px;max-width:min(1100px,100%);max-height:100%}
#vwImg{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:6px;cursor:zoom-out;background:#111}
.vwb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;color:#fff;font-size:.85rem}
.vwb span{color:#fff!important}
.vwb button{font:inherit;font-size:.85rem;padding:6px 10px;margin-left:6px;border:1px solid #888;border-radius:6px;background:#222;color:#fff;cursor:pointer}
img.th{cursor:zoom-in}
.pk{background:var(--surface);color:var(--fg);border-radius:8px;width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:14px 16px;display:grid;gap:10px}
.pkh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pkc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
#pkImgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:200px}
#pkImgs figure{margin:0}
#pkImgs img{width:100%;height:320px;object-fit:cover;border-radius:6px;cursor:pointer;outline:2px solid transparent}
#pkImgs img:hover{outline-color:var(--accent)}
#pkImgs figcaption{font-size:.72rem;margin-top:3px}
.pkf{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
#pkCur img{width:36px;height:36px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:6px}
.pkr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pkr input{flex:1 1 260px;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--fg)}
.pkr a{color:var(--fg);font-weight:700}
.pkempty{grid-column:1/-1;align-self:center;text-align:center}
@media (max-width:600px){#pkImgs img{height:200px}}

td.pic{width:92px;min-width:92px;white-space:normal}
td.symc{width:172px;min-width:172px;white-space:normal}
td.pic .ths{float:none;margin:0 0 4px 0}
.syms{display:flex;flex-wrap:wrap;gap:4px;max-width:250px}
.sym{display:inline-flex;flex-direction:column;align-items:flex-start;width:78px;font-size:.66rem;line-height:1.25}
.sym img{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:3px}
.sym small{display:block;font-size:.66rem;word-break:keep-all}
.sym .mate{font-weight:700}
.noimg{display:block;width:64px;height:20px;font-size:.62rem}
.proj{display:inline-block;padding:0 5px;border:1.5px solid #8a4b16;border-radius:3px;color:#8a4b16;font-weight:700;background:#fbf1e6;white-space:nowrap}
</style>

  <defs>

</svg>

<div class="wrap">
  <header>
    <h1>Piet Oudolf 수종리스트</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="legend" id="legend"></div>

  <div class="search">
    <input id="q" type="search" placeholder="학명, 국명, 과, 역할, 생장습성, 토양으로 검색 (예: 지피, 국화과, 건조, 증식 빠름)" autocomplete="off">
    <span id="count" class="count"></span>
    <span class="imgtools" id="imgtools" hidden><span id="pkCount"></span></span>
  </div>

  <div class="scroll">
    <table>
      <thead><tr><th class="picth">사진</th><th>기호</th><th>학명</th><th>서식처</th><th>Z</th><th>초장(cm)</th><th>주/㎡</th><th>개화기</th><th>관상</th><th>역할</th><th>생장습성</th><th>특성</th><th>비고</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot">기준은 《Work》(2023)입니다. 《식재디자인》(2013)과 《꿈의식물》(2003)은 앞선 책에 없는 값만 채웠습니다. 연두색 칸은 《Work》(2023)에 실린 종입니다.  주/㎡는 9cm 포트 기준이며 2L 포트를 쓰면 10~15% 줄여 심습니다. Z는 USDA 내한성 구역입니다.</p>
</div>

<div id="view" hidden><div class="vw"><img id="vwImg" alt=""><div class="vwb"><span id="vwCap"></span><span><button id="vwOther" type="button">다른 사진</button><button id="vwEdit" type="button">사진 바꾸기</button><button id="vwX" type="button">닫기</button></span></div></div></div>
<div id="pick" hidden><div class="pk" role="dialog" aria-label="사진 고르기">
  <div class="pkh"><b id="pkName"></b><button id="pkX" type="button">닫기</button></div>
  <p id="pkNote"></p>
  <div class="pkc"><button id="pkPrev" type="button" aria-label="이전">◀</button><div id="pkImgs"></div><button id="pkNext" type="button" aria-label="다음">▶</button></div>
  <div class="pkf"><span id="pkPage"></span><span id="pkCur"></span></div>
  <div class="pkr"><a id="pkG" target="_blank" rel="noopener">Google 이미지 검색 ↗</a><input id="pkUrl" placeholder="이미지 주소 붙여넣기 · 이미지 자체는 Ctrl+V"><button id="pkUse" type="button">이 주소로 정하기</button><label class="btn">파일 추가<input id="pkFile" type="file" accept="image/*" hidden></label><button id="pkDel" type="button">사진 지우기</button></div>
</div></div>

irhoe": "칼리레속", "Cirsium": "엉겅퀴속", "Dalea": "달레아속", "Datisca": "다티스카속", "Dianthus": "패랭이꽃속", "Dictamnus": "백선속", "Epilobium": "바늘꽃속", "Foeniculum": "회향속", "Galega": "갈레가속", "Glycyrrhiza": "감초속", "Helianthus": "해바라기속", "Persicaria": "여뀌속", "Laserpitium": "라세르피티움속", "Lindelofia": "린델로피아속", "Linaria": "해란초속", "Molopospermum": "몰로포스페르뭄속", "Oxalis": "괭이밥속", "Pachysandra": "수호초속", "Petrorhagia": "페트로라기아속", "Peucedanum": "기름나물속", "Pimpinella": "참나물속", "Platycodon": "도라지속", "Podophyllum": "포도필룸속", "Potentilla": "양지꽃속", "Ranunculus": "미나리아재비속", "Saruma": "사루마속", "Seseli": "세셀리속", "Serratula": "산비장이속", "Smyrnium": "스미르니움속", "Solidaster": "솔리다스테르속", "Stokesia": "풍차국속", "Strobilanthes": "방울꽃속", "Succisella": "수시셀라속", "Tanacetum": "쑥국화속", "Teucrium": "곽향속", "Trachystemon": "트라키스테몬속", "Valeriana": "쥐오줌풀속", "Verbena": "마편초속", "Viola": "제비꽃속", "Zigadenus": "지가데누스속", "Brachypodium": "숲개밀속", "Chrysopogon": "크리소포곤속", "Imperata": "띠속", "Melica": "쌀새속", "Muhlenbergia": "쥐꼬리새속", "Sedum": "세둠속", "Elsholtzia": "향유속", "Maackia": "다릅나무속", "Rhus": "옻나무속"}, "gdn": {"Achillea": "팬케이크처럼 납작하게 모여 피는 꽃, 이삭형·구형 꽃과 잘 어울림", "Aconitum": "손바닥 모양으로 갈라진 윤기 나는 잎, 수도승 두건 같은 꽃, 호박벌 수분", "Actaea": "그늘정원 필수, 깃 모양 잎, 노루삼 계열(열매)·승마 계열(긴 꽃이삭), 흙 수분이 마르지 않으면 햇빛도 견딤, 수분 부족 시 잎이 오그라듦", "Agastache": "줄기가 튼튼해 쓰러지지 않음, 아니스 향, 벌·나비, 겨울 마른 모습도 좋음, 오래 살지 않아 자연발아 여지를 남겨야 함", "Alcea": "수명이 짧아 2~3년, 길어야 4~5년, 돌 틈·자갈 사이에서 싹이 더 잘 틈", "Alchemilla": "회녹색 주름진 넓은 잎, 노란연두색 자잘한 꽃, 무수정생식", "Amsonia": "오래 삶, 가늘고 매끈한 잎, 연한 파란색 별 모양 꽃, 대부분 북미 자생", "Anemone": "솜털로 덮인 잎, 대여섯 장 꽃잎에 수술이 올라온 모양, 봄 종류는 키 작고 깊게 갈라진 잎과 털 달린 씨앗, 가을 대상화는 첫 겨울 보온 필수", "Angelica": "튼튼한 산형과, 반구형 꽃차례, 피부 화상 없음, 수명이 짧지만 비옥·적습 토양에서 쉽게 자연발아", "Aquilegia": "세 갈래 겹잎, 꽃뿔이 있는 꽃, 대개 몇 년밖에 못 살지만 자연발아로 유지, 밝은 그늘·비옥한 토양", "Aralia": "딱총나무 같은 겹잎, 원뿔꽃차례, 검푸른 열매, 반그늘·비옥·적습 토양이 최적, 양지·척박·가뭄도 견딤", "Artemisia": "회색 잎으로 다른 색을 엮어 줌, 흰꽃쑥 외 모든 종은 건조·배수 좋은 토양과 햇빛을 좋아하고 습한 겨울에 약함", "Asarum": "짙은 그늘에서 천천히 자라는 상록성, 촉촉한 숲 토양 필요, 잎 아래 숨은 갈색 꽃", "Asclepias": "복잡한 꽃, 제왕나비 애벌레 먹이, 뾰족한 열매에서 흰 털 씨앗이 날림", "Aster": "빛이 잘 들거나 살짝 그늘진 곳 어디서나 잘 자람, 포기나누기 쉬움, 종마다 번지는 정도가 다름, 대부분 지금은 Symphyotrichum", "Astilbe": "깃 모양 잎, 원뿔꽃차례, 뿌리가 얕아 수분이 조금만 부족해도 잎이 말리고 갈변", "Astrantia": "윤기 나는 갈라진 잎, 채색된 포엽 중심에 작은 꽃, 비옥하고 수분이 계속 유지되는 토양", "Baptisia": "루피너스 같은 꽃, 큰 덩치, 관목 같은 형태, 세 갈래 회색빛 잎, 뿌리 내리고 성숙하기까지 오래 걸림, 가을 검은 열매", "Calamintha": "타임·민트와 가까움, 향이 좋음, 긴 꽃대에 자잘한 꽃", "Callirhoe": "건조한 미국 서부 자생, 아욱과 비슷, 수명이 짧은 편", "Campanula": "수십여 종이 정원식물로 사랑받아 옴", "Centaurea": "수백 종, 유럽 남부에 많음, 정원에서 의외로 드묾", "Clematis": "목질화하지 않는 숙근 종류, 지지대 또는 작은 관목·튼튼한 식물과 함께 식재, 비옥한 석회질 토양", "Crambe": "거대한 잎과 풍성한 꽃, 뿌리혹병 예방에 석회질 토양, 배추흰나비 애벌레", "Delphinium": "꽃대가 무거워 쉽게 쓰러짐, 그래스나 은은한 꽃과 조합, 만개 전 꽃대를 자르면 다음 꽃대가 꼿꼿, 비옥한 점토질 토양, 매년 골분 비료", "Dianthus": "햇빛과 건조를 좋아함, 가는 잎, 파스텔 꽃", "Digitalis": "두해살이 또는 단명 숙근초, 왕성하게 자연발아, 첫해 로제트 다음 해 꽃대, 대개 꽃이 진 후 죽음", "Echinacea": "북미 대초원 대표, 솔방울처럼 볼록한 중심, 햇빛·물빠짐 좋은 비옥한 토양, 수명이 짧다는 평판(곰팡이병·민달팽이·경쟁 약함), 더운 기후에서는 자연발아로 이어감, E. paradoxa로 노란색 추가", "Echinops": "깊게 갈라진 가시 잎, 공 모양 꽃, 꿀벌·호박벌·나비, 건조·습·척박·비옥 어떤 조건에서도 잘 자람", "Epimedium": "세 장 작은잎 겹잎의 지피, 꽃잎 네 장 작은 봄꽃, 관상가치는 잎, 겨우내 초록 또는 갈색·구릿빛, 3월에 묵은 잎을 잘라야 꽃이 보임", "Eryngium": "골무 모양 꽃, 잎과 총포조각에 톱니·가시, 회청색", "Eupatorium": "거친 잎, 늦여름 우산 모양 꽃, 나비·벌, 축축하고 비옥한 토양, 몇 년 후 바깥 줄기가 쓰러지기 쉬워 포기나누기", "Euphorbia": "화려한 포엽, 줄기 액체 독성(눈 주의), 대부분 추위에 약하나 내한성 있는 종도 있음", "Filipendula": "깃 모양 잎, 거품 같은 꽃차례, 비옥하고 부식질 풍부하며 수분이 마르지 않는 토양", "Galega": "벳지 닮은 깃 잎, 나비 모양 꽃, G. officinalis는 골칫거리", "Gentiana": "고산식물, 밝은 남색, 대부분 저지대에서 까다로움", "Geranium": "키우기 쉬움, 둥근 잎, 다섯 장 꽃잎, 최신 품종 위주 소개", "Geum": "땅을 감싸는 촘촘한 떨기, 따뜻한 색조", "Helenium": "갈색 원통 중심에 화관 같은 꽃잎, 늦여름 구조감과 색, 색이 튐", "Helianthus": "북미 대초원 대형, 가을 샛노란 꽃, H. ×laetiflorus는 주체할 수 없이 번짐", "Helleborus": "겨울정원, 광택 상록 잎, 12월부터 종 모양 포엽, 비옥한 토양(구덩이에 벽돌 조각·퇴비)", "Hemerocallis": "그래스 같은 아치형 잎, 백합 닮은 하루꽃, 강철같이 튼튼, 덜 화려한 종 위주 소개", "Hosta": "잎이 멋짐, 그늘에서 부피감, 부식질 풍부·촉촉·물빠짐 좋은 토양과 가벼운 그늘, 흙이 마르지 않으면 햇빛도, 어둡거나 과습하면 달팽이 밥", "Inula": "평범한 잎과 노란 데이지꽃의 대규모 속", "Iris": "칼 모양 잎, 꽃이 진 후에도 여름 내내 아름다움", "Kalimeris": "들국화 같은 데이지, 키 큰 것은 어정쩡해 섞어 심음", "Knautia": "체꽃과 비슷하나 더 튼튼, 나비", "Lamium": "입술 모양 꽃, 대부분 걷잡을 수 없이 자라나 번지지 않는 종도 있음", "Laserpitium": "산형과 중 수명이 매우 김, 자리 잡기까지 몇 년, 옮겨심기 싫어함, 잎이 아름다움", "Lavatera": "아욱과 비슷, 손바닥 잎, 물결 꽃잎 다섯 장, L. olbia 계열('Barnsley' 등)은 추위에 약하고 곁줄기가 나옴", "Liatris": "그래스 같은 가는 잎, 곤봉 모양 꽃차례(위에서 아래로 핌), 절화, 관상용 그래스 사이에 심으면 뻣뻣함이 사라짐, 비옥하고 수분 유지되는 토양", "Ligularia": "큼지막한 잎, 노란 데이지 총상꽃차례, 동아시아 식물상, 비가 많으면 양지도, 여름에 마르면 안 되고 겨울엔 물빠짐 좋아야 함, 달팽이, 무더운 날 잎이 처짐", "Linaria": "입술 모양 꽃, 대부분 한해살이이거나 단명", "Liriope": "그래스 같은 상록, 카펫처럼 땅을 덮음, 여름이 습한 기후의 그늘정원 지피에 좋음, 서늘한 여름에는 느림", "Lobelia": "입술 닮은 꽃, 북미 종은 겨울이 너무 춥지 않으면 여러 해 삶, 단명하나 자연발아, 수분이 충분히 유지되는 토양 필수", "Lysimachia": "축축한 곳, 다섯 장 꽃잎의 규칙적인 꽃, 기는 종류와 마구잡이로 번지는 종류", "Lythrum": "선명한 꽃색의 습지식물, 일반 토양도 가능, L. salicaria·L. virgatum은 북미 침입종이라 사용하지 않는 것이 좋음", "Mertensia": "숲에서 봄에 피는 꽃, 매끈한 달걀 모양 잎, 하늘색 종 모양 꽃, 비옥한 토양", "Monarda": "가장 중요한 속 중 하나, 쓰러지지 않는 줄기, 향 좋은 잎, 오래 풍성한 꽃, 포엽이 중요, 나비, 오래된 품종은 흰가루병, 몇 년 뒤 중심부를 버리고 바깥 부분을 포기나누기, 물빠짐 중요(점토질에서 잘 못 자람)", "Nepeta": "곰팡이 핀 레몬 냄새, 고양이, 비교적 덜 알려진 종 소개(고양이가 덜 좋아함)", "Origanum": "허브 향, 관목처럼 자람, 건조한 석회질 토양, 곤충", "Pachysandra": "엄밀히는 관목, 상록 지피", "Papaver": "크레이프지 같은 꽃잎 네 장, 두터운 수술, 여러해살이만 소개", "Penstemon": "북미 원산, 디기탈리스 닮은 꽃, 대다수가 겨울 추위에 약함, 비옥하고 물빠짐 좋은 토양", "Persicaria": "Polygonum이라고도 부름, 대부분 성가시거나 걷잡을 수 없이 자람, 마디 많은 줄기, 거친 잎, 원뿔·이삭꽃차례, 얌전한 품종은 비옥한 토양에서 활용도 높음", "Phlomis": "입술 모양 큰 꽃이 줄기에 돌려 달림, 꽃 진 뒤에도 형태 유지, 비옥하고 물빠짐 좋은 토양과 더운 곳", "Phlox": "꽃망울이 돌돌 말림, 다섯 장 규칙적 꽃잎, 칼 푀르스터가 사랑한 속", "Podophyllum": "부식질 풍부한 숲, 두툼한 줄기에 큰 잎, 뿌리와 잎에 강한 독성", "Polemonium": "깃 모양 마주나는 잎(사다리 같음), 비교적 큰 꽃, 꽃고비는 자연발아가 너무 심해 덜 성가신 품종 소개", "Polygonatum": "매우 강한 음지식물, 거의 모든 토양, 짧은 뿌리줄기로 서서히 퍼짐, 종 모양 흰 꽃, 서리 내린 듯 파란빛 열매", "Potentilla": "딸기와 가까움, 3~5장 손바닥 겹잎, 톱니, 대부분 고산, 정원용은 일부", "Pulmonaria": "이른 봄 꽃, 여름엔 잎, 달걀 모양 잎에 흰 무늬", "Pycnanthemum": "진한 향, 두드러진 포엽, 번지는 습성(모나르다와 가까움), 벌·꽃가루 매개 곤충, 대부분의 토양에서 왕성하게 번지나 관리 쉬움, 뜨거운 여름 선호", "Ranunculus": "수백 종의 대규모 속, 평범해 보여 덜 심지만 아름다움, 손바닥 잎, 윤기 나는 꽃", "Rodgersia": "그늘정원 제격, 칠엽수 같은 큰 잎, 흰 원뿔꽃, 처음엔 느리나 몇 년 뒤 수 ㎡ 무리, 건조에 약하나 큰 잎이 흙을 덮어 줌", "Rudbeckia": "거친 잎, 중심이 뭉툭한 원뿔인 데이지 꽃, 혀꽃이 떨어져야 비로소 흥미로움", "Salvia": "보헤미안처럼 자유로운 모습, 톡 쏘는 향, 입술 모양 꽃의 두건 같은 윗입술", "Sanguisorba": "기르기 쉽고 쓸 만함, 깃 모양 톱니 잎이 꽃 전부터 가치, 매듭 같은 자잘한 꽃이 이삭·공 모양, 술오이풀 외 모두 수분 충분한 토양, 명명법 뒤죽박죽", "Scabiosa": "핀쿠션 같은 2~3cm 꽃차례, 파스텔 색, S. caucasica 외 모두 햇빛·석회질·건조 토양, 나비, 자연발아", "Sidalcea": "미나리아재비 같은 손바닥 잎, 아욱 닮은 다섯 장 꽃잎", "Silphium": "북미 톨그라스 프레리 자생 거대 식물, 큰 잎, 해바라기 닮은 노란 꽃", "Solidago": "대부분 짧게 화려한 노란 꽃 피우며 걷잡을 수 없이 퍼짐, 여기 소개된 종은 믿어도 좋음", "Stachys": "Betonica 계열은 잘 알려지지 않음, 주름진 길쭉한 잎, 야생난초 같은 이삭꽃, 파스텔 색", "Tanacetum": "예전 국화속에서 분리, 쑥국화(T. vulgare)와 달리 소개 종은 번지지 않음", "Thalictrum": "매발톱꽃 닮은 겹잎, 우아한 원뿔꽃차례, 수술 다발이 눈길", "Tiarella": "그늘정원 지피, 털 있는 심장 모양 잎, 불규칙한 톱니, 초기 구릿빛 잎", "Tricyrtis": "보석처럼 정교, 검은 반점 잎, 무늬 별 모양 꽃, 부식질 풍부하고 흙이 마르지 않는 다소 빛 드는 그늘", "Trifolium": "약 250종, 상당수 꽃이 매력적, 초식동물이 좋아함", "Veratrum": "빼어난 모습, 긴 수명, 평행 잎맥의 큰 달걀 잎, 별 모양 꽃의 큰 원뿔, 마른 꽃대도 멋짐, 첫 개화까지 최대 7년, 매년 피지 않음, 절대 옮겨 심지 말 것, 달팽이", "Verbascum": "대부분 두해살이, 첫해 털 로제트, 이듬해 노란 꽃 횃불, 교잡 쉬움", "Verbena": "사각 튼튼한 줄기, 거친 좁은 잎, 자잘한 꽃이 촘촘히 이삭·원뿔, 곤충", "Vernonia": "아주 늦은 개화, 붉은빛 진한 자주 꽃, 나비, 모든 종이 비슷하고 키가 큼", "Veronica": "네 장 꽃잎, 맨 아래 꽃잎이 작음, 이삭꽃", "Viola": "숲 제비꽃은 여러해살이·봄 짧은 개화, 팬지 계열(V. cornuta)은 더 오래", "Andropogon": "톨그라스 프레리 주종, '초원의 바다'", "Carex": "꽃이 꽃대축에 모여 핌, 그늘·척박지 적합, 손이 덜 가는 상록성, 다발형은 숲 음지식물·구근과 그늘 채우기, 퍼지는 종은 그늘 잔디 대체", "Eragrostis": "300여 종, 세련된 꽃차례, 건조한 열대·아열대, 햇빛 잘 들면 추위도 견딤", "Melica": "우아한 소형종, 극도로 건조한 서식지, 짧은 개화, 자연발아가 잘 됨", "Molinia": "평판은 안 좋지만 위엄 있는 식물, 가을 주황빛 노랑, 황무지·산성 숲, 납작한 이삭", "Muhlenbergia": "난지형(warm-season) 그래스, 유럽에선 잘 못 자람, 건조한 서식지에서 떨기", "Sesleria": "빳빳한 청록 잎 촘촘한 떨기, 키 작음, 석회암 절벽의 뜨겁고 척박한 곳", "Stipa": "스텝 그래스, 실 같은 잎, 바늘 같은 까락, 건조·물빠짐 좋은 토양과 더운 여름, 습한 겨울 후 사라지나 자연발아"}, "grole": {"Achillea": ["고온건조지", "멋진 형태(대부분의 품종)", "해안가(교잡종)"], "Agastache": ["고온건조지", "겨울 실루엣", "여름~가을 개화(많은 종)", "밀원(나비)"], "Alcea": ["고온건조지", "여름~가을 개화"], "Artemisia": ["고온건조지(흰꽃쑥 제외)", "은회색(다른색과 조화)(흰꽃쑥 제외)", "토끼 기피", "해안가(회색 잎 종류)"], "Dianthus": ["고온건조지", "밀원(나비) function sci(name){

}

    total+=n;
    const [lat,ko]=f.split(" ");
    return `<tr class="fam"><th colspan="13"><span class="fl">${lat}</span> <span class="fk">${ko}</span> <span class="fn">${n}</span></th></tr>`+out;
  }).join("");
  document.getElementById("rows").innerHTML=html||`<tr><td colspan="13" class="empty">"${esc(q)}"에 맞는 수종이 없어요.</td></tr>`;
  document.getElementById("count").textContent=q?`${total}건 찾음`:`전체 ${ALL}건`;
}
const ALL=DATA.rows.length+Object.keys(DATA.genus).length;
document.getElementById("sub").textContent=`출처: 《Work》(2023) · 《식재디자인》(2013) · 《꿈의식물》(2003) · Vandalorum(2024) · ${ALL}건`;
const qEl=document.getElementById("q");
qEl.addEventListener("input",()=>render(qEl.value));

/* ── 사진 고르기 (구글 시트·드라이브에 저장 — 현장조사툴 서버 사용) ── */
const IMGON=location.protocol==="file:"||/\.github\.io$/.test(location.hostname);
const EP="https://script.google.com/macros/s/AKfycbz_QfCwye48SzCArIT4D-fVyucfJrDnmkAZGcwvtRALtKm0X0t93OIOGhbFN3T075s/exec";
const TOOLW="https://plantlist.younrake.workers.dev";
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
let PICK={},LOADED=false;
const FIXED=DATA.img||{};
const slot=(n,k)=>arr(PICK[n])[k]||arr(FIXED[n])[k];
function thumb(n){if(!IMGON)return"";
  return `<span class="ths">${[0,1].map(k=>{const p=slot(n,k);return p?`<img class="th" src="${esc(p.u)}" data-n="${esc(n)}" data-s="${k}" alt="" loading="lazy">`:`<span class="th add" data-n="${esc(n)}" data-s="${k}" title="사진 ${k+1} 고르기">+</span>`}).join("")}</span>`}
function pkCount(t){const c=document.getElementById("pkCount");if(!c)return;const v=Object.values(PICK);
  c.textContent=(t?t+" · ":"")+(LOADED?`고른 사진 ${v.reduce((a,x)=>a+arr(x).filter(Boolean).length,0)}장 (${v.filter(x=>arr(x).some(Boolean)).length}종)`:"사진 불러오는 중…")}
function getPw(force){let pw="";try{pw=localStorage.getItem("fn_pw")||""}catch(e){}
  if(!pw||force){pw=(prompt("사진을 저장하려면 현장조사툴 비밀번호를 넣어 주세요.")||"").trim();if(pw)try{localStorage.setItem("fn_pw",pw)}catch(e){}}
  return pw}
async function api(body,retry){const pw=getPw(retry);if(!pw)throw new Error("비밀번호가 없어 저장하지 않았어요.");
  const r=await fetch(EP,{method:"POST",body:JSON.stringify(Object.assign({password:pw},body))});const j=await r.json();
  if(!j.ok){if(/비밀번호/.test(j.error||"")&&!retry)return api(body,true);throw new Error(j.error||"저장 실패")}return j}
async function saveItems(items){pkCount("저장 중…");
  try{await api({action:"pietSave",items});pkCount("저장됨")}catch(e){pkCount("저장 실패: "+e.message)}}
async function upload(n,dataUrl){pkMsg("사진을 드라이브에 올리는 중…");const j=await api({action:"pietUpload",name:n,data:dataUrl});return{u:j.u,a:"",s:"직접 추가"}}
async function loadPicks(){
  try{const j=await (await fetch(EP+"?action=piet")).json();if(!j.ok)throw new Error(j.error);PICK=j.picks||{};LOADED=true}
  catch(e){LOADED=true;pkCount("사진 목록을 불러오지 못했어요");return}
  pkCount();render(qEl.value);
  /* 예전에 이 브라우저에만 저장했던 선택을 한 번 옮김 */
  let old={};try{old=JSON.parse(localStorage.getItem("pietImg1")||"{}")}catch(e){}
  const items={};
  for(const n in old){const a=arr(old[n]);if(!a.some(Boolean)||PICK[n])continue;
    const b=[];for(let k=0;k<2;k++){const x=a[k];if(!x){b.push(null);continue}
      if(/^data:/.test(x.u)){try{b.push(await upload(n,x.u))}catch(e){b.push(null)}}else b.push(x)}
    if(b.some(Boolean)){items[n]=b;PICK[n]=b}}
  if(Object.keys(items).length){await saveItems(items);render(qEl.value)}
  try{localStorage.removeItem("pietImg1")}catch(e){}
}
const pk={n:"",s:0,ph:[],i:0,tok:0};
function pkMsg(t){document.getElementById("pkNote").textContent=t}
function baseName(n){let b=n.replace(/\(.*?\)/g,"").replace(/'[^']*'/g,"").replace(/×/g," ").replace(/\b(spp\.|cvs\.|and|hybrids|cultivars|varieties|Group|similar|species|related|types)\b.*$/,"");
  return b.replace(/,.*$/,"").replace(/\s+/g," ").trim()}
const fj=(u,ms=9000)=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).then(r=>r.json())};
/* 후보 사진: 식재분석툴과 같은 출처 (툴에 넣어둔 사진 → Commons → iNaturalist → GBIF) */
async function srcTool(n){const out=[];for(const q of [...new Set([n,baseName(n)])]){try{const d=await fj(TOOLW+"/api/img/load?plant="+encodeURIComponent(q));(d.images||[]).forEach(u=>out.push({u,a:"",s:"식재분석툴"}))}catch(e){}}return out}
async function srcWiki(q){try{const s=await fj(`https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srnamespace=6&srlimit=40&format=json&origin=*`);
  const files=(s.query?.search||[]).map(r=>r.title).filter(t=>/\.(jpe?g|png)$/i.test(t)&&!/map|distribution|range|icon|logo|diagram|coat|flag|stamp/i.test(t)).slice(0,20);
  if(!files.length)return[];
  const info=await fj(`https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(files.join("|"))}&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*`);
  return Object.values(info.query?.pages||{}).map(p=>p.imageinfo?.[0]?.thumburl).filter(Boolean).map(u=>({u,a:"",s:"Wikimedia Commons"}))}catch(e){return[]}}
async function srcInat(q){try{let t=(await fj("https://api.inaturalist.org/v1/taxa?q="+encodeURIComponent(q)+"&per_page=1")).results?.[0];
  if(!t&&q.split(" ").length>2)t=(await fj("https://api.inaturalist.org/v1/taxa?q="+encodeURIComponent(q.split(" ").slice(0,2).join(" "))+"&per_page=1")).results?.[0];
  if(!t)return[];const out=[];
  const d=await fj("https://api.inaturalist.org/v1/taxa/"+t.id);(d.results?.[0]?.taxon_photos||[]).forEach(x=>out.push({u:x.photo.medium_url||x.photo.url,a:x.photo.attribution,s:"iNaturalist"}));
  const o=await fj(`https://api.inaturalist.org/v1/observations?taxon_id=${t.id}&quality_grade=research&photos=true&per_page=20&order_by=votes`);
  for(const ob of o.results||[])for(const ph of ob.photos||[]){const u=ph.url?.replace("/square.","/medium.");if(u)out.push({u,a:ph.attribution,s:"iNaturalist"})}
  return out}catch(e){return[]}}
async function srcGbif(q){try{const d=await fj(`https://api.gbif.org/v1/occurrence/search?mediaType=StillImage&scientificName=${encodeURIComponent(q)}&limit=20&hasCoordinate=false`);
  const out=[];for(const oc of d.results||[])for(const m of oc.media||[])if(m.identifier&&/\.(jpe?g|png)/i.test(m.identifier))out.push({u:m.identifier,a:m.rightsHolder||m.creator||"",s:"GBIF"});return out}catch(e){return[]}}
async function loadCands(n){
  const tok=++pk.tok,b=baseName(n),cv=/'/.test(n);pk.ph=[];pk.i=0;showCands();pkMsg("사진을 찾는 중…");
  const ps=[srcTool(n),cv?srcWiki(n.replace(/\(.*?\)/g,"").trim()):Promise.resolve([]),srcInat(b),srcWiki(b),srcGbif(b)];
  const seen=new Set();
  for(const p of ps){const r=await p;if(tok!==pk.tok)return;r.forEach(x=>{if(x.u&&!seen.has(x.u)){seen.add(x.u);pk.ph.push(x)}});showCands()}
  const by={};pk.ph.forEach(x=>by[x.s]=(by[x.s]||0)+1);
  pkMsg(pk.ph.length?`후보 ${pk.ph.length}장 (${Object.entries(by).map(([k,v])=>k+" "+v).join(", ")})${cv?" · 품종 사진이 아닌 종 사진이 섞여 있어요":""}`:"후보를 찾지 못했어요. Google 이미지 검색이나 붙여넣기를 써 주세요.")}
function showCands(){const box=document.getElementById("pkImgs");
  const two=pk.ph.slice(pk.i,pk.i+2);
  box.innerHTML=two.map((p,k)=>`<figure><img src="${esc(p.u)}" data-k="${pk.i+k}" alt=""><figcaption>${esc(p.s)}${p.a?" · "+esc(p.a):""}</figcaption></figure>`).join("")||'<div class="pkempty">후보 없음</div>';
  document.getElementById("pkPage").textContent=pk.ph.length?`${pk.i+1}–${Math.min(pk.i+2,pk.ph.length)} / ${pk.ph.length}`:"";
  const cur=slot(pk.n,pk.s);document.getElementById("pkCur").innerHTML=cur?`<img src="${esc(cur.u)}" alt="">현재 사진 ${pk.s+1}`:"";
}
function setPick(p){const n=pk.n,a=arr(PICK[n]).slice(0,2);while(a.length<2)a.push(null);a[pk.s]=p;PICK[n]=a;render(qEl.value);closePick();saveItems({[n]:a})}
function openPick(n,s){pk.n=n;pk.s=s;document.getElementById("pkName").textContent=`${n} · 사진 ${s+1}`;
  document.getElementById("pkG").href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(n.replace(/\(.*?\)/g,"").trim());
  document.getElementById("pkUrl").value="";document.getElementById("pick").hidden=false;loadCands(n)}
function closePick(){document.getElementById("pick").hidden=true;pk.tok++}
const vw={n:"",s:0};
function openView(n,s){vw.n=n;vw.s=s;const p=slot(n,s);if(!p)return;
  document.getElementById("vwImg").src=p.u;document.getElementById("vwCap").textContent=`${n} · 사진 ${s+1}${p.s?" · "+p.s:""}${p.a?" · "+p.a:""}`;
  document.getElementById("view").hidden=false}
function closeView(){document.getElementById("view").hidden=true}
const asData=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});
async function addFile(f){if(!f||!/^image\//.test(f.type))return;try{setPick(await upload(pk.n,await asData(f)))}catch(e){pkMsg("올리지 못했어요: "+e.message)}}
if(IMGON){
  document.getElementById("imgtools").hidden=false;pkCount();loadPicks();
  document.getElementById("rows").addEventListener("click",e=>{const t=e.target.closest(".th");if(!t)return;if(t.tagName==="IMG")openView(t.dataset.n,+t.dataset.s);else openPick(t.dataset.n,+t.dataset.s)});
  document.getElementById("pkX").onclick=closePick;
  document.getElementById("vwX").onclick=closeView;
  document.getElementById("view").addEventListener("click",e=>{if(e.target.id==="view"||e.target.id==="vwImg")closeView()});
  document.getElementById("vwEdit").onclick=()=>{closeView();openPick(vw.n,vw.s)};
  document.getElementById("vwOther").onclick=()=>{const o=1-vw.s;if(slot(vw.n,o))openView(vw.n,o)};
  document.getElementById("pick").addEventListener("click",e=>{if(e.target.id==="pick")closePick()});
  document.getElementById("pkPrev").onclick=()=>{pk.i=Math.max(0,pk.i-2);showCands()};
  document.getElementById("pkNext").onclick=()=>{if(pk.i+2<pk.ph.length){pk.i+=2;showCands()}};
  document.getElementById("pkImgs").addEventListener("click",e=>{const im=e.target.closest("img[data-k]");if(im)setPick(pk.ph[+im.dataset.k])});
  document.getElementById("pkUse").onclick=()=>{const u=document.getElementById("pkUrl").value.trim();if(/^https?:/.test(u))setPick({u,a:"",s:"웹"});else pkMsg("이미지 주소(https://…)를 붙여넣어 주세요.")};
  document.getElementById("pkDel").onclick=()=>{const n=pk.n,a=arr(PICK[n]).slice(0,2);while(a.length<2)a.push(null);a[pk.s]=null;PICK[n]=a;render(qEl.value);closePick();saveItems({[n]:a})};
  document.getElementById("pkFile").onchange=e=>addFile(e.target.files[0]);
  document.addEventListener("paste",e=>{if(document.getElementById("pick").hidden)return;const it=[...((e.clipboardData||{}).items||[])].find(x=>x.type.startsWith("image/"));if(it){e.preventDefault();addFile(it.getAsFile())}});
  document.addEventListener("keydown",e=>{if(!document.getElementById("view").hidden){if(e.key==="Escape")closeView();if(e.key==="ArrowRight"||e.key==="ArrowLeft")document.getElementById("vwOther").click();return}if(document.getElementById("pick").hidden)return;if(e.target.id==="pkUrl")return;if(e.key==="Escape")closePick();if(e.key==="ArrowRight")document.getElementById("pkNext").click();if(e.key==="ArrowLeft")document.getElementById("pkPrev").click()});
  render(qEl.value);
}

render(qEl.value||"");
document.getElementById("legend").innerHTML=
 `<div class="grp"><span class="lab">햇빛</span>${Object.values(LIGHT).map(([id,t])=>`<span class="it">${ic(id)}${t}</span>`).join("")}</div>`+
 `<div class="grp"><span class="lab">잎</span><span class="it">${ic("leafi","leaf")}잎 관상 가치</span></div>`+
 `<div class="grp"><span class="lab">구조적 흥미</span>${["B","Y","U","X"].map(k=>`<span class="it">${ic(STRUCT[k][0])}${STRUCT[k][1]}</span>`).join("")}</div>`+
 `<div class="grp"><span class="lab">생장습성</span><span class="it"><span class="tag">습성</span></span><span class="it"><span class="tag warn">주의</span></span><span class="it"><span class="tag good">기후 유리</span></span></div>`+
 `<div class="grp"><span class="lab">출처</span><span class="it"><span style="display:inline-block;width:14px;height:14px;background:var(--work);border:1px solid var(--rule)"></span>《Work》(2023)에 실린 종</span><span class="it"><span class="proj">vandalorum(2024)</span>프로젝트 식재 범례</span></div>`;
</script>
